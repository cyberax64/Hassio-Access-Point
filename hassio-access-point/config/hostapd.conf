# hostapd configuration template
# This file will be used as a template and customized at runtime

# Control interface
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# Basic settings
# interface and ssid will be set at runtime
interface=wlan0
ssid=HomeAssistant
channel=6
beacon_int=100
max_num_sta=8

# Hardware mode - g for 2.4GHz
hw_mode=g

# 802.11n support - enabled by default
ieee80211n=1
wmm_enabled=1

# HT capabilities - will be adjusted based on hardware detection
ht_capab=[SHORT-GI-20][SHORT-GI-40][HT40+]

# Security settings - WPA2
wpa=2
# wpa_passphrase will be set at runtime
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
wpa_group_rekey=86400

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# Other settings
dtim_period=2
rts_threshold=2347
fragm_threshold=2346
macaddr_acl=0
auth_algs=3
ignore_broadcast_ssid=0

# WMM settings for QoS
wmm_enabled=1
wmm_ac_bk_cwmin=4
wmm_ac_bk_cwmax=10
wmm_ac_bk_aifs=7
wmm_ac_bk_txop_limit=0
wmm_ac_bk_acm=0
wmm_ac_be_aifs=3
wmm_ac_be_cwmin=4
wmm_ac_be_cwmax=10
wmm_ac_be_txop_limit=0
wmm_ac_be_acm=0
wmm_ac_vi_aifs=2
wmm_ac_vi_cwmin=3
wmm_ac_vi_cwmax=4
wmm_ac_vi_txop_limit=94
wmm_ac_vi_acm=0
wmm_ac_vo_aifs=2
wmm_ac_vo_cwmin=2
wmm_ac_vo_cwmax=3
wmm_ac_vo_txop_limit=47
wmm_ac_vo_acm=0

# EAPOL settings
eapol_key_index_workaround=0
eap_server=0
own_ip_addr=127.0.0.1
