# dnsmasq configuration template
# This file will be used as a template and customized at runtime

# Basic settings
# interface will be set at runtime
interface=wlan0

# DNS settings
domain-needed
bogus-priv
no-resolv
no-poll

# DHCP settings
# dhcp-range will be set at runtime
dhcp-option=option:router,192.168.0.1
dhcp-authoritative
dhcp-lease-max=150
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
