---
name: Home Assistant Access Point
version: 1.0.0
slug: hassio-access-point
description: Create a WiFi access point to directly connect devices to Home Assistant. Compatible with x86, ARM and Raspberry Pi.
arch: [armhf, armv7, aarch64, amd64, i386]
url: https://github.com/cyberax64/Hassio-Access-Point
startup: system
boot: auto
host_network: true
apparmor: true
host_dbus: true
privileged:
  - NET_ADMIN
init: false
hassio_api: true
hassio_role: default
panel_icon: mdi:wifi
panel_title: Access Point
map:
  - config:rw
  - ssl:ro
options:
  # Basic settings
  ssid: HomeAssistant
  wpa_passphrase: HomeAssistantPassword
  channel: 6
  address: 192.168.10.1
  netmask: 255.255.255.0
  broadcast: 192.168.10.255
  interface: wlan0
  
  # DHCP settings
  dhcp: true
  dhcp_start_addr: 192.168.10.10
  dhcp_end_addr: 192.168.10.200
  
  # Security settings
  hide_ssid: false
  allow_mac_addresses: []
  deny_mac_addresses: []
  
  # Internet access
  client_internet_access: false
  client_dns_override: []
  
  # Advanced settings
  debug: 0
  hostapd_config_override: []
  dnsmasq_config_override: []
schema:
  # Basic settings
  ssid: match(^.{2,32}$)
  wpa_passphrase: password
  channel: int(1,13)
  address: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  netmask: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  broadcast: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  interface: str
  
  # DHCP settings
  dhcp: bool
  dhcp_start_addr: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  dhcp_end_addr: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  
  # Security settings
  hide_ssid: bool
  allow_mac_addresses:
    - match(^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$)?
  deny_mac_addresses:
    - match(^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$)?
  
  # Internet access
  client_internet_access: bool
  client_dns_override:
    - match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
  
  # Advanced settings
  debug: int(0,2)
  hostapd_config_override:
    - str?
  dnsmasq_config_override:
    - str?
